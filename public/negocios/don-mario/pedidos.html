<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Don Mario · Pedidos</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180x180.png">
  <link rel="apple-touch-icon-precomposed" href="apple-touch-icon-precomposed.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
  <link rel="manifest" href="rtk-site.webmanifest">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Great+Vibes&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    body.rtk-site-loading{overflow:hidden}
    .rtk-root-preloader{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:linear-gradient(135deg,#5d120d,#8f1f17 58%,#c8963e);color:#fff;transition:opacity .38s ease,visibility .38s ease}
    .rtk-root-preloader.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
    .rtk-root-preloader-card{width:min(340px,calc(100vw - 42px));display:grid;justify-items:center;gap:14px;text-align:center;padding:26px}
    .rtk-root-preloader-logo{width:96px;height:96px;border-radius:24px;object-fit:contain;background:#fff;padding:10px;box-shadow:0 20px 48px rgba(0,0,0,.28)}
    .rtk-root-preloader-kicker{margin:0;color:rgba(255,255,255,.74);font-size:11px;font-weight:900;letter-spacing:.28em;text-transform:uppercase}
     .rtk-root-preloader-title{margin:0;font-family:'Allura','Great Vibes',cursive;font-size:clamp(2.25rem,9vw,3.65rem);line-height:.98;font-weight:400;letter-spacing:0;text-shadow:0 12px 28px rgba(0,0,0,.24)}
     .title-script{font-family:'Allura','Great Vibes',cursive;font-weight:400;letter-spacing:.01em}
    .rtk-root-preloader-bar{width:min(18rem,72vw);height:10px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden}
    .rtk-root-preloader-fill{display:block;width:48%;height:100%;border-radius:999px;background:linear-gradient(90deg,#c8963e,#fff);animation:rtkRootLoad 1s ease-in-out infinite}
    @keyframes rtkRootLoad{0%{transform:translateX(-115%)}100%{transform:translateX(230%)}}
  </style>
</head>
<body class="bg-stone-100 text-stone-900 min-h-screen rtk-site-loading">
  <div id="rtkRootPreloader" class="rtk-root-preloader" role="status" aria-live="polite">
    <div class="rtk-root-preloader-card">
      <img class="rtk-root-preloader-logo" src="apple-touch-icon-180x180.png" alt="Don Mario">
      <div>
        <p class="rtk-root-preloader-kicker">Cargando pedidos</p>
        <h1 class="rtk-root-preloader-title">Don Mario</h1>
      </div>
      <div class="rtk-root-preloader-bar" aria-hidden="true"><i class="rtk-root-preloader-fill"></i></div>
    </div>
  </div>
  <header class="text-white sticky top-0 z-10 shadow" style="background:#8f1f17">
    <div class="max-w-6xl mx-auto p-4 flex flex-wrap gap-3 justify-between items-center">
       <div><p class="text-xs text-white/60 uppercase tracking-widest">Don Mario</p><h1 class="title-script text-4xl leading-none">Control de pedidos</h1></div>
      <button onclick="loadOrders()" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-xl font-bold">↻ Actualizar</button>
    </div>
  </header>
  <main class="max-w-6xl mx-auto p-4">
    <section id="login" class="max-w-md mx-auto mt-16 bg-white p-6 rounded-2xl shadow">
      <h2 class="text-xl font-black">Acceso interno</h2>
      <p class="text-sm text-stone-500 mt-1">Ingresa la clave administrativa.</p>
      <input id="key" type="password" class="mt-4 w-full border rounded-xl px-4 py-3" autocomplete="current-password" placeholder="Clave">
      <button onclick="login()" class="mt-3 w-full text-white rounded-xl py-3 font-bold" style="background:#8f1f17">Entrar</button>
      <p id="login-error" class="text-red-700 text-sm mt-3 hidden">Clave incorrecta.</p>
    </section>
    <section id="dashboard" class="hidden">
      <div id="summary" class="grid grid-cols-2 md:grid-cols-4 gap-3 my-5"></div>
      <div class="flex gap-2 overflow-x-auto pb-3">
        <button onclick="setFilter('todos')" class="filter px-4 py-2 rounded-full bg-stone-900 text-white whitespace-nowrap" data-filter="todos">Todos</button>
        <button onclick="setFilter('pendiente')" class="filter px-4 py-2 rounded-full bg-white whitespace-nowrap" data-filter="pendiente">Pendientes</button>
        <button onclick="setFilter('preparacion')" class="filter px-4 py-2 rounded-full bg-white whitespace-nowrap" data-filter="preparacion">Preparación</button>
        <button onclick="setFilter('en_camino')" class="filter px-4 py-2 rounded-full bg-white whitespace-nowrap" data-filter="en_camino">En camino</button>
        <button onclick="setFilter('entregado')" class="filter px-4 py-2 rounded-full bg-white whitespace-nowrap" data-filter="entregado">Entregados</button>
      </div>
      <div id="orders" class="grid md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
      <p id="empty" class="hidden text-center text-stone-500 py-20">No hay pedidos en este estado.</p>
    </section>
  </main>
  <script>
    (function(){
      const started = performance.now();
      const loader = document.getElementById('rtkRootPreloader');
      let done = false;
      function finish(){
        if (done) return;
        done = true;
        const wait = Math.max(0, 6000 - (performance.now() - started));
        setTimeout(function(){
          document.body.classList.remove('rtk-site-loading');
          if (loader) loader.classList.add('is-hidden');
        }, wait);
      }
      window.addEventListener('load', finish, {once:true});
      setTimeout(finish, 6000);
    })();

    const labels = {pendiente:'Pendiente',preparacion:'En preparación',en_camino:'En camino',entregado:'Entregado'};
    const colors = {pendiente:'bg-amber-100 text-amber-900',preparacion:'bg-blue-100 text-blue-900',en_camino:'bg-violet-100 text-violet-900',entregado:'bg-green-100 text-green-900'};
    let adminKey = sessionStorage.getItem('donMarioAdminKey') || '';
    let orders = [];
    let filter = 'todos';
    if (adminKey) loadOrders();
    async function login() {
      adminKey = document.getElementById('key').value.trim();
      sessionStorage.setItem('donMarioAdminKey', adminKey);
      await loadOrders();
    }
    async function api(body) {
      const response = await fetch('api/orders.php', {
        method: body ? 'POST' : 'GET',
        headers: {'Content-Type':'application/json','X-Admin-Key':adminKey},
        body: body ? JSON.stringify(body) : undefined
      });
      if (response.status === 401) throw new Error('unauthorized');
      if (!response.ok) throw new Error('request');
      return response.json();
    }
    async function loadOrders() {
      try {
        const result = await api();
        orders = result.data;
        document.getElementById('login').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        render();
      } catch (error) {
        sessionStorage.removeItem('donMarioAdminKey');
        document.getElementById('login').classList.remove('hidden');
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('login-error').classList.remove('hidden');
      }
    }
    function setFilter(value) {
      filter = value;
      document.querySelectorAll('.filter').forEach(button => {
        const active = button.dataset.filter === value;
        button.classList.toggle('bg-stone-900', active);
        button.classList.toggle('text-white', active);
        button.classList.toggle('bg-white', !active);
      });
      render();
    }
    function render() {
      document.getElementById('summary').innerHTML = Object.keys(labels).map(status => `
        <div class="bg-white rounded-xl p-4 shadow-sm"><p class="text-xs text-stone-500">${labels[status]}</p><p class="text-3xl font-black">${orders.filter(o=>o.status===status).length}</p></div>`).join('');
      const visible = filter === 'todos' ? orders : orders.filter(order => order.status === filter);
      document.getElementById('empty').classList.toggle('hidden', visible.length > 0);
      document.getElementById('orders').innerHTML = visible.map(order => `
        <article class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
          <div class="p-4 flex justify-between gap-3 border-b">
            <div><h2 class="font-black">${order.folio}</h2><p class="text-xs text-stone-500">${new Date(order.created_at).toLocaleString('es-MX')}</p></div>
            <span class="h-fit px-3 py-1 rounded-full text-xs font-bold ${colors[order.status]}">${labels[order.status]}</span>
          </div>
          <div class="p-4 space-y-2">${order.items.map(item=>`<div class="flex justify-between text-sm"><span><b>${item.q}×</b> ${escapeHtml(item.name)}</span><span>$${item.subtotal.toFixed(2)}</span></div>`).join('')}</div>
          ${order.envio ? `<a class="block mx-4 mb-3 p-3 bg-green-50 text-green-900 rounded-xl text-xs" target="_blank" rel="noopener" href="https://maps.google.com/?q=${order.envio.lat},${order.envio.lng}">📍 ${escapeHtml(order.envio.address || 'Ver ubicación')}</a>` : ''}
          <div class="px-4 pb-3 flex justify-between font-black"><span>Total</span><span style="color:#8f1f17">$${order.total.toFixed(2)}</span></div>
          <div class="p-3 bg-stone-50 grid grid-cols-2 gap-2">
            ${Object.keys(labels).map(status=>`<button ${status===order.status?'disabled':''} onclick="changeStatus('${order.folio}','${status}')" class="text-xs p-2 rounded-lg border bg-white disabled:opacity-30">${labels[status]}</button>`).join('')}
          </div>
        </article>`).join('');
    }
    async function changeStatus(folio, status) {
      await api({action:'status', folio, status});
      await loadOrders();
    }
    function escapeHtml(value) {
      const node = document.createElement('div');
      node.textContent = value;
      return node.innerHTML;
    }
    setInterval(() => { if (adminKey) loadOrders(); }, 30000);
  </script>
</body>
</html>
